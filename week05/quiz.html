<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A quiz about HTML and CSS">
    <meta name="author" content="Timothy Puente">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>HTML and CSS Quiz</title>

</head>

<body>


    <main class="box">
        <h1>
            &check;Basic HTML and CSS Quiz
        </h1>

        <form>
            <div classs="quiz-item">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="quiz-item">
                <label for="q2">2. How are comments made in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <div class="quiz-item">
                <label for="q3">3. Which of the following is the correct way to use flex to
                    reverse the order of a row of items?</label>
                <select id="q3" name="q3">
                    <option selected disabled>Choose one...</option>
                    <option value="a">a. flex: row</option>
                    <option value="b">b. flex-direction: row;</option>
                    <option value="c">c. flex-direction: row-reverse;</option>
                </select>
            </div>

            <div class="quiz-item">
                <label for="q4">4. What is the bottom margin given to this declaration?</label>
                <code class="box">margin: 10px 5px 15px; </code>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Answers</button>
        </form>
    </main>

    <footer>

    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!--meta description-->
    <meta name="description" content="This is the home page. This is supposed to be the attention grabber.
    This needs to include company information, calls to action, possibly good graphics, and anything else
    that can make my website stick out. ">
    <!-- meta author-->
    <meta name="author" content="Timothy Puente">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-boat-splash.jpg" alt="Crazy White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/homepage_hero.jpg" alt="hero">
            <h1> Are You Up For the Challenge?</h1>
            <!-- Using an online sugestion when making a link to look like a button. 
             Creating class "button - link and following per online suggestion" -->
            <!-- Problem 1 8/5/2026 -->
            <!-- Having trouble centering button on the hero picture -->
            <!-- Problem solved 8/6: Putting the button inside the article and adjusting in CSS -->
            <article><a href="trips.html" class="button-link">Conquer Challenge</a>
                <form>
                    <P> Want to see new adventures and offers?</P>
                    <div class="input">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="input">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                </form>
            </article>
        </div>
        <section class="grid-box">
            <figure>
                <img src="images/rafting64_1024-2.jpg" alt="Offering Rapids">
                <figcaption>Rapids</figcaption>
            </figure>

            <figure>
                <img src="images/rafting43_600-2.jpg" alt="Offering Rivers">
                <figcaption>Rivers</figcaption>
            </figure>

            <figure>
                <img src="images/rafters_camping.jpeg" alt="Offering Camping">
                <figcaption>Camping</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Crazy White Water Rafting Timothy Puente</p>
        <nav class="socialmedia">
            <a href="https://www.tiktok.com/login">
                <img src="images/tiktok.jpg" alt="Tiktok">
            </a>
            <a href="https://www.facebook.com">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn">
            </a>
        </nav>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!--meta description-->
    <meta name="description" content="Crazy White Water Rafting contact info">
    <!-- meta author-->
    <meta name="author" content="Timothy Puente">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-boat-splash.jpg" alt="Crazy White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="address">

            <h1>Contact Us</h1>

            <p>
                125 W Rapid Dr.
            </p>
            <p>Flagstaff, AZ</p>
            <p>480 977 1543</p>
            <p>cwwrapids@gmail.com</p>
        </div>

        <div class="map"><iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d52158.18792122987!2d-111.71579974693493!3d35.209289899999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x872d8f4984ea112b%3A0x97f6d06ba6e6f8d6!2sFlagstaff%20Medical%20Center!5e0!3m2!1sen!2sus!4v1785626112524!5m2!1sen!2sus"
              width="300" height="250" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

        <form>
            <div class="input">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="input">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>

            <div class="input">
                <p>Please choose the purpose for contacting:</p>
                <label for="inquiry"> General Inquiry</label>
                <input type="radio" id="inquiry" name="inquiry">

                <label for="reservation"> Reservation Question</label>
                <input type="radio" id="reservation" name="inquiry">

                <label for="suggestion"> Website suggestion</label>
                <input type="radio" id="suggestion" name="inquiry">

            </div>

            <div class="input">
                <label for="message">Please type your message here: </label>
                <textarea id="message" name="message" rows="4"
                  placeholder="Hello, I am ..."></textarea>
            </div>

            <div class="input">
                <label for="subscribe"> Please subsribe me to the monthly newsletter</label>
                <input type="checkbox" id="subscribe" name="subscribe">
            </div>
            <button type="submit">Submit</button>
        </form>

        <section class="service">
            <h2>We are here to help!</h2>

            <figure>
                <img src="images/240_F_687501687_GAbf0c8TFqIaTgOCiHj1iIlh4HA4UTb3-2.jpg"
                  alt="Pablo">
                <figcaption>Pablo Cruz</figcaption>
            </figure>

            <figure>
                <img src="images/240_F_300328326_YH3xXQAQNCMVIL39m2QHNPDnasISkg19-2.jpg"
                  alt="Trevor">
                <figcaption>Trevor McGuinnes</figcaption>
            </figure>

            <figure>
                <img src="images/240_F_1474110234_CENJhFRrlrDcWF56lG8qeXbAISeOPmlB-2.jpg"
                  alt="Tory">
                <figcaption>Tory Westcott</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Crazy White Water Rafting Timothy Puente</p>
        <nav class="socialmedia">
            <a href="https://www.tiktok.com/login">
                <img src="images/tiktok.jpg" alt="Tiktok">
            </a>
            <a href="https://www.facebook.com">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn">
            </a>
        </nav>
    </footer>
</body>

</html>
